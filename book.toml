[book]
title       = "Noah Kawaguchi"
authors     = ["Noah Kawaguchi"]
description = "Noah Kawaguchi's website"
language    = "en"

[rust]
edition = "2024"

[output.html]
print.enable  = false
additional-js = ["theme/script.js"]
site-url      = "https://noahkawaguchi.com/" # Required by `mdbook-rss-feed`

[preprocessor.rss-feed]
renderers        = ["html"]              # Ensure the preprocessor only runs for HTML builds
before           = ["frontmatter-strip"] # Run this before `mdbook-frontmatter-strip`
default-behavior = "exclude-all"         # Opt-in mode: only include chapters marked `feed: include`
strict           = true                  # Fail the build on a frontmatter parse error

[preprocessor.frontmatter-strip]
renderers = ["html"]

# Rename `rss.xml` to `feed.xml`, including the self link inside the file, and remove trailing
# `index.html` from item URLs
[preprocessor.feed-rename]
command = "./scripts/feed-rename.sh"
after   = ["rss-feed"]
